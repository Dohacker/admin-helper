<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SA-MP Mobile Admin Hub</title>
    <style>
        :root {
            --bg: #0d1117;
            --card-bg: #161b22;
            --border: #30363d;
            --accent: #58a6ff;
            --green: #238636;
            --red: #da3633;
            --purple: #8957e5;
            --text: #c9d1d9;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background: var(--bg); color: var(--text); padding-bottom: 80px; }

        /* Mobil Header */
        header {
            background: rgba(22, 27, 34, 0.95);
            position: sticky; top: 0; z-index: 100;
            padding: 12px 16px;
            border-bottom: 1px solid var(--border);
            display: flex; justify-content: space-between; align-items: center;
            backdrop-filter: blur(10px);
        }
        .logo { font-weight: bold; color: var(--accent); font-size: 1.1rem; display: flex; align-items: center; gap: 8px; }
        .dot { width: 8px; height: 8px; background: #3fb950; border-radius: 50%; box-shadow: 0 0 8px #3fb950; }
        .norma-badge { background: var(--green); color: #fff; padding: 4px 10px; border-radius: 20px; font-size: 0.8rem; font-weight: bold; }

        /* Asosiy Mobil Kontent */
        .container { padding: 12px; display: flex; flex-direction: column; gap: 14px; }

        .card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
        .card-header { padding: 10px 14px; background: rgba(255,255,255,0.02); border-bottom: 1px solid var(--border); font-size: 0.9rem; font-weight: bold; display: flex; justify-content: space-between; color: #8b949e; }

        /* Report Item (Katta va qulay) */
        .report-card { background: #1f242d; border: 1px solid var(--border); border-left: 4px solid var(--accent); border-radius: 10px; padding: 12px; margin-bottom: 10px; display: flex; flex-direction: column; gap: 10px; }
        .report-msg { font-size: 0.95rem; color: #fff; word-break: break-word; line-height: 1.4; }
        .report-time { font-size: 0.75rem; color: #8b949e; }

        /* Mobil Tugmalar */
        .btn-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        .btn {
            background: rgba(255,255,255,0.05); border: 1px solid var(--border); color: #fff;
            padding: 10px; border-radius: 8px; font-size: 0.85rem; font-weight: 600;
            text-align: center; cursor: pointer; transition: 0.1s;
        }
        .btn:active { transform: scale(0.97); opacity: 0.8; }
        .btn-green { background: var(--green); border-color: var(--green); }
        .btn-tp { background: var(--purple); border-color: var(--purple); grid-column: span 2; padding: 12px; font-size: 0.95rem; }

        /* Admin Chat Box */
        .chat-box { max-height: 200px; overflow-y: auto; padding: 10px; font-size: 0.85rem; display: flex; flex-direction: column; gap: 6px; }
        .chat-item { padding: 6px 8px; background: rgba(0,0,0,0.2); border-radius: 6px; border-left: 2px solid var(--accent); }

        /* Pastki Qotirilgan Boshqaruv Paneli (Bottom Navigation) */
        .bottom-nav {
            position: fixed; bottom: 0; left: 0; right: 0;
            background: #161b22; border-top: 1px solid var(--border);
            padding: 10px 14px; display: flex; gap: 8px; z-index: 1000;
        }
        .chat-input { flex: 1; background: #0d1117; border: 1px solid var(--border); color: #fff; padding: 10px 12px; border-radius: 8px; font-size: 0.9rem; outline: none; }
    </style>
</head>
<body>

    <header>
        <div class="logo"><div class="dot"></div> Admin Hub</div>
        <div class="norma-badge">Norma: <span id="daily-count">0</span></div>
    </header>

    <div class="container">
        <!-- Teleport Tugmasi -->
        <button class="btn btn-tp" onclick="exec('/tp')">🌀 O'yinda /tp Menyusini Ochish</button>

        <!-- Reportlar -->
        <div class="card">
            <div class="card-header">
                <span>🚨 KELGAN REPORTLAR</span>
                <span id="rep-count">0 ta</span>
            </div>
            <div style="padding: 10px;" id="report-list">
                <div style="text-align:center; color:#8b949e; padding:15px; font-size:0.85rem;">Hozircha reportlar yo'q...</div>
            </div>
        </div>

        <!-- Admin Chat -->
        <div class="card">
            <div class="card-header">💬 ADMIN CHAT ([ADM])</div>
            <div class="chat-box" id="chat-list">
                <div style="color:#8b949e; text-align:center;">Chat bo'sh...</div>
            </div>
        </div>
    </div>

    <!-- Pastki Tezkor Input -->
    <div class="bottom-nav">
        <input type="text" id="a-input" class="chat-input" placeholder="/a xabar yozish...">
        <button class="btn btn-green" style="padding: 10px 16px;" onclick="sendAdminChat()">Yuborish</button>
    </div>

    <script>
        const SERVER_URL = 'http://' + window.location.hostname + ':3000';

        async function updateData() {
            try {
                const res = await fetch(`${SERVER_URL}/api/data`);
                const data = await res.json();

                // 1. Norma hisoblagichi
                document.getElementById('daily-count').innerText = data.stats.daily || 0;

                // 2. Reportlar
                const repList = document.getElementById('report-list');
                document.getElementById('rep-count').innerText = `${data.reports.length} ta`;

                if (data.reports.length > 0) {
                    repList.innerHTML = data.reports.map(r => `
                        <div class="report-card">
                            <div class="report-msg">${r.text}</div>
                            <div class="report-time">${r.time}</div>
                            <div class="btn-grid">
                                <button class="btn btn-green" onclick="sendReply('${r.id}', 'Assalomu alaykum, kuzatishni boshladim.')">Tekshiruvda</button>
                                <button class="btn" onclick="sendReply('${r.id}', 'Qoidabuzarlik tasdiqlanmadi.')">Aybsiz</button>
                                <button class="btn" onclick="sendReply('${r.id}', 'O\'yinchi jazolandi. Rahmat!')">Jazolandi</button>
                                <button class="btn" onclick="sendReply('${r.id}', 'O\'yinchi tekshiruvda, biroz kuting.')">Kuting</button>
                            </div>
                        </div>
                    `).join('');
                } else {
                    repList.innerHTML = `<div style="text-align:center; color:#8b949e; padding:15px; font-size:0.85rem;">Hozircha reportlar yo'q...</div>`;
                }

                // 3. Admin Chat
                const chatList = document.getElementById('chat-list');
                if (data.adminChat.length > 0) {
                    chatList.innerHTML = data.adminChat.map(c => `
                        <div class="chat-item">
                            <span style="color:#8b949e; font-size:0.75rem;">[${c.time}]</span><br>${c.text}
                        </div>
                    `).join('');
                }
            } catch (e) { console.error(e); }
        }

        function exec(cmd) {
            fetch(`${SERVER_URL}/api/execute`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ command: cmd })
            });
        }

        function sendReply(id, replyText) {
            exec(`/ot ${id}`);
            setTimeout(() => {
                exec(`/ans ${id} ${replyText}`);
            }, 600);
        }

        function sendAdminChat() {
            const input = document.getElementById('a-input');
            if (input.value.trim()) {
                exec(`/a ${input.value.trim()}`);
                input.value = '';
            }
        }

        setInterval(updateData, 1000);
    </script>
</body>
</html>
